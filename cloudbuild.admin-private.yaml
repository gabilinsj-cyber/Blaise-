# Private Blaise V6 RJ administrator APK only. No deployment, keys or weather APIs.
# Uses the default-pool E2_STANDARD_2 eligible for the 2500 free build-minutes per billing account/month.
# The free quota is not guaranteed to remain; Cloud Storage and network fees may apply.
# Requires operator to approve Android SDK licenses in launcher.
substitutions:
  _ADMIN_BUCKET: "REQUIRED"
  _BUILD_RUN_ID: "REQUIRED"
steps:
  - name: "eclipse-temurin:17-jdk-jammy"
    entrypoint: bash
    args: ["scripts/cloudbuild-admin-private-build.sh"]
    env: ["ACCEPT_ANDROID_SDK_LICENSES=yes"]
timeout: "3600s"
options:
  machineType: E2_STANDARD_2
  diskSizeGb: "100"
  logging: CLOUD_LOGGING_ONLY
artifacts:
  objects:
    location: "gs://$_ADMIN_BUCKET/private-admin/$_BUILD_RUN_ID/"
    paths:
      - "app/build/outputs/apk/admin/app-admin.apk"
