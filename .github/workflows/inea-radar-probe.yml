name: INEA Radar Gateway Probe

on:
  workflow_dispatch:
    inputs:
      execute_live_probe:
        description: 'Query the public official INEA Radar Tool gateway contract'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: inea-radar-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Record external radar probe not requested
        if: ${{ !inputs.execute_live_probe }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/official-sources
          cat > evidence/official-sources/inea-radar.json <<'JSON'
          {
            "sourceId": "inea-radar-tool-gateway",
            "contract": "official_radar_tool_gateway",
            "status": "BLOCKED_EXTERNAL_EXECUTION_NOT_REQUESTED",
            "execution": "NOT_RUN_EXPLICIT_APPROVAL_REQUIRED",
            "gatewayContract": "NOT_RUN_EXPLICIT_APPROVAL_REQUIRED",
            "liveRadarFrameIngestion": "NOT_IMPLEMENTED"
          }
          JSON

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v5
        if: ${{ inputs.execute_live_probe }}
        with:
          node-version: '24.20.0'

      - name: Validate and probe official INEA Radar Tool gateway
        if: ${{ inputs.execute_live_probe }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.20.0"
          node --check backend/src/inea-radar-source.mjs
          node --check backend/scripts/probe-inea-radar.mjs
          node backend/scripts/probe-inea-radar.mjs

      - name: Upload INEA radar evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: blaise-inea-radar-evidence
          if-no-files-found: error
          path: evidence/official-sources/inea-radar.json
