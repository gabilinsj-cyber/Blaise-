name: CEMADEN-RJ Source Probe

on:
  workflow_dispatch:
    inputs:
      execute_live_probe:
        description: 'Query the public CEMADEN-RJ hydrological-risk page and validate the 92-city contract'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: cemaden-rj-source-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: '24.20.0'

      - name: Record explicit no-execution state
        if: ${{ !inputs.execute_live_probe }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backend/evidence/official-sources
          cat > backend/evidence/official-sources/cemaden-rj-hydrological-risk.json <<'JSON'
          {
            "sourceId": "cemaden-rj-hydrological-risk",
            "contract": "official_hydrological_risk_status_92_municipalities",
            "status": "NOT_RUN_EXTERNAL_EXECUTION_NOT_REQUESTED",
            "execution": "NOT_RUN_EXPLICIT_APPROVAL_REQUIRED",
            "operationalFreshnessValidation": "NOT_YET_PROVEN",
            "appRiskReconciliation": "NOT_IMPLEMENTED",
            "p0PromotionPolicy": "NOT_IMPLEMENTED",
            "rawHtmlRetention": "NONE"
          }
          JSON

      - name: Execute explicitly approved public-source probe
        if: ${{ inputs.execute_live_probe }}
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.20.0"
          node scripts/probe-cemaden-rj.mjs

      - name: Upload sanitized source evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: blaise-cemaden-rj-source-evidence
          if-no-files-found: error
          path: backend/evidence/official-sources/cemaden-rj-hydrological-risk.json
