name: Android Release Gate

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  release-package:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Prepare Android SDK CLI
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/build-tools/35.0.0" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version
      - uses: gradle/actions/wrapper-validation@v4
      - name: Install Android 35 toolchain
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
          test -x "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          test -x "$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign"
      - name: Install pinned bundletool
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/bundletool.jar" https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $RUNNER_TEMP/bundletool.jar" | sha256sum -c -
          echo "BUNDLETOOL_JAR=$RUNNER_TEMP/bundletool.jar" >> "$GITHUB_ENV"
      - name: Prepare production signing fail-closed
        env:
          BLAISE_KEYSTORE_B64: ${{ secrets.BLAISE_KEYSTORE_B64 }}
          BLAISE_STORE_PASSWORD: ${{ secrets.BLAISE_STORE_PASSWORD }}
          BLAISE_KEY_ALIAS: ${{ secrets.BLAISE_KEY_ALIAS }}
          BLAISE_KEY_PASSWORD: ${{ secrets.BLAISE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in BLAISE_KEYSTORE_B64 BLAISE_STORE_PASSWORD BLAISE_KEY_ALIAS BLAISE_KEY_PASSWORD; do
            [[ -n "${!name:-}" ]] || { echo "BLOCKED: missing $name" >&2; exit 2; }
          done
          printf '%s' "$BLAISE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/blaise-release.jks"
          chmod 600 "$RUNNER_TEMP/blaise-release.jks"
          {
            echo "BLAISE_KEYSTORE_PATH=$RUNNER_TEMP/blaise-release.jks"
            echo "BLAISE_STORE_PASSWORD=$BLAISE_STORE_PASSWORD"
            echo "BLAISE_KEY_ALIAS=$BLAISE_KEY_ALIAS"
            echo "BLAISE_KEY_PASSWORD=$BLAISE_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Signed release package gate
        run: bash scripts/release-gate.sh
      - name: Upload signed release evidence
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: blaise-v6-signed-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            evidence/release/**
