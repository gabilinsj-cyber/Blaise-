name: Android Release Gate

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  release-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Prepare Android SDK CLI
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/build-tools/35.0.0" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version
      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Install Android 35 toolchain
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
          test -x "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          test -x "$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign"
      - name: Install pinned bundletool
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/bundletool.jar" https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $RUNNER_TEMP/bundletool.jar" | sha256sum -c -
          echo "BUNDLETOOL_JAR=$RUNNER_TEMP/bundletool.jar" >> "$GITHUB_ENV"
      - name: Prepare production signing fail-closed
        env:
          BLAISE_SIGNING_B64: ${{ secrets.BLAISE_SIGNING_BUNDLE_B64 || secrets.BLAISE_KEYSTORE_B64 || secrets.BLAISE_ANDROID_KEYSTORE_BASE64 }}
          BLAISE_STORE_PASSWORD: ${{ secrets.BLAISE_STORE_PASSWORD || secrets.BLAISE_ANDROID_KEYSTORE_PASSWORD }}
          BLAISE_KEY_ALIAS: ${{ secrets.BLAISE_KEY_ALIAS || secrets.BLAISE_ANDROID_KEY_ALIAS }}
          BLAISE_KEY_PASSWORD: ${{ secrets.BLAISE_KEY_PASSWORD || secrets.BLAISE_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "${BLAISE_SIGNING_B64:-}" ]] || { echo "BLOCKED: missing signing secret (accepted: BLAISE_SIGNING_BUNDLE_B64, BLAISE_KEYSTORE_B64, or BLAISE_ANDROID_KEYSTORE_BASE64)" >&2; exit 2; }

          NORMALIZED_SIGNING_B64="$(printf '%s' "$BLAISE_SIGNING_B64" | tr -d '[:space:]')"
          [[ -n "$NORMALIZED_SIGNING_B64" ]] || { echo "BLOCKED: signing secret is empty after whitespace normalization" >&2; exit 2; }

          payload="$RUNNER_TEMP/blaise-signing.payload"
          if ! printf '%s' "$NORMALIZED_SIGNING_B64" | base64 --decode > "$payload"; then
            rm -f "$payload"
            echo "BLOCKED: signing secret is not valid Base64." >&2
            exit 2
          fi
          [[ -s "$payload" ]] || { echo "BLOCKED: decoded signing payload is empty" >&2; exit 2; }

          keystore="$RUNNER_TEMP/blaise-release.jks"
          if tar -tzf "$payload" >/dev/null 2>&1; then
            signing_dir="$RUNNER_TEMP/blaise-signing"
            mkdir -p "$signing_dir"
            tar -xzf "$payload" -C "$signing_dir" --no-same-owner --no-same-permissions
            test -s "$signing_dir/blaise-release.jks"
            test -s "$signing_dir/signing.properties"
            cp "$signing_dir/blaise-release.jks" "$keystore"

            store_b64="$(sed -n 's/^BLAISE_STORE_PASSWORD_B64=//p' "$signing_dir/signing.properties")"
            alias_b64="$(sed -n 's/^BLAISE_KEY_ALIAS_B64=//p' "$signing_dir/signing.properties")"
            key_b64="$(sed -n 's/^BLAISE_KEY_PASSWORD_B64=//p' "$signing_dir/signing.properties")"
            [[ -n "$store_b64" && -n "$alias_b64" && -n "$key_b64" ]] || { echo "BLOCKED: signing bundle metadata is incomplete" >&2; exit 2; }
            BLAISE_STORE_PASSWORD="$(printf '%s' "$store_b64" | base64 --decode)"
            BLAISE_KEY_ALIAS="$(printf '%s' "$alias_b64" | base64 --decode)"
            BLAISE_KEY_PASSWORD="$(printf '%s' "$key_b64" | base64 --decode)"
          else
            mv "$payload" "$keystore"
            missing=0
            [[ -n "${BLAISE_STORE_PASSWORD:-}" ]] || { echo "BLOCKED: raw keystore mode requires BLAISE_STORE_PASSWORD (or BLAISE_ANDROID_KEYSTORE_PASSWORD)" >&2; missing=1; }
            [[ -n "${BLAISE_KEY_ALIAS:-}" ]] || { echo "BLOCKED: raw keystore mode requires BLAISE_KEY_ALIAS (or BLAISE_ANDROID_KEY_ALIAS)" >&2; missing=1; }
            [[ -n "${BLAISE_KEY_PASSWORD:-}" ]] || { echo "BLOCKED: raw keystore mode requires BLAISE_KEY_PASSWORD (or BLAISE_ANDROID_KEY_PASSWORD)" >&2; missing=1; }
            (( missing == 0 )) || exit 2
          fi

          chmod 600 "$keystore"
          if ! keytool -list -keystore "$keystore" -storepass "$BLAISE_STORE_PASSWORD" -alias "$BLAISE_KEY_ALIAS" >/dev/null; then
            echo "BLOCKED: decoded keystore could not be opened with the configured signing credentials." >&2
            exit 2
          fi

          {
            echo "BLAISE_KEYSTORE_PATH=$keystore"
            echo "BLAISE_STORE_PASSWORD=$BLAISE_STORE_PASSWORD"
            echo "BLAISE_KEY_ALIAS=$BLAISE_KEY_ALIAS"
            echo "BLAISE_KEY_PASSWORD=$BLAISE_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Signed release package gate
        env:
          BLAISE_MONTHLY_PRODUCT_ID: ${{ vars.BLAISE_MONTHLY_PRODUCT_ID }}
          BLAISE_ANNUAL_PRODUCT_ID: ${{ vars.BLAISE_ANNUAL_PRODUCT_ID }}
          BLAISE_ENTITLEMENT_VERIFY_URL: ${{ vars.BLAISE_ENTITLEMENT_VERIFY_URL }}
        run: bash scripts/release-gate.sh
      - name: Upload signed release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success()
        with:
          name: blaise-v6-signed-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            evidence/release/**
