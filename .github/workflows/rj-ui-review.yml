name: Blaise RJ UI visual and functional review
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/rj-interface-emulator-review.sh'
      - 'scripts/rj-inmet-live-probe.mjs'
      - 'scripts/rj-live-information-probe.mjs'
      - '.github/workflows/rj-ui-review.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rj-ui-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  emulator-review:
    # Limited to the approved RJ interface, radar-readiness and named-source matrix PRs.
    # No subscription or production store-release PR can consume emulator time.
    if: >-
      github.event_name == 'pull_request' &&
      (github.event.pull_request.head.ref == 'fix/rj-freshness-seven-day-history' || github.event.pull_request.head.ref == 'codex/rj-unified-city-evidence-20261014' || github.event.pull_request.head.ref == 'codex/rj-live-integration-fix-20261014' || github.event.pull_request.head.ref == 'codex/rj-alert-hourly-validity' ||
       github.event.pull_request.head.ref == 'codex/rj-current-weighted-sources-20261014' ||
       github.event.pull_request.head.ref == 'codex/rj-final-reference-dashboard-20261010' ||
       github.event.pull_request.head.ref == 'codex/rj-continuous-sources-radar-paid-validation-20261011' ||
       github.event.pull_request.head.ref == 'codex/rj-meteo-homolog-20261011' ||
       github.event.pull_request.head.ref == 'codex/rj-linked-meteorological-marine-tables-20261012' ||
       github.event.pull_request.head.ref == 'codex/rj-real-source-status-table-marine-20261014' ||
       github.event.pull_request.head.ref == 'codex/rj-selected-city-inmet-charts-20261012')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Allow hardware acceleration for Android emulator
        run: |
          set -euo pipefail
          if test -e /dev/kvm; then
            sudo chmod a+rw /dev/kvm
          else
            echo '/dev/kvm missing: hardware-accelerated emulator is unavailable'
            exit 1
          fi
      - name: Build debug app and instrumentation test runner
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Probe current public INMET RJ station readings (non-blocking)
        run: |
          node --check scripts/rj-inmet-live-probe.mjs
          node scripts/rj-inmet-live-probe.mjs
      - name: Verify live RSS, USGS, forecast readiness and public backend (read-only)
        run: |
          node --check scripts/rj-live-information-probe.mjs
          node scripts/rj-live-information-probe.mjs
      - name: Run visual/functional emulator checks and capture evidence
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          disk-size: 6G
          disable-animations: true
          emulator-options: '-no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -no-snapshot -camera-back none'
          script: bash scripts/rj-interface-emulator-review.sh
      - name: Upload only visual evidence and test logs (no heavy APK)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blaise-rj-ui-visual-functional-evidence
          path: evidence/rj-interface-review/
          if-no-files-found: warn
          retention-days: 5

  source-connections:
    if: github.event_name == 'pull_request' && (github.event.pull_request.head.ref == 'codex/rj-current-weighted-sources-20261014' || github.event.pull_request.head.ref == 'codex/rj-unified-city-evidence-20261014' || github.event.pull_request.head.ref == 'codex/rj-live-integration-fix-20261014' || github.event.pull_request.head.ref == 'codex/rj-alert-hourly-validity')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.20.0'
      - name: Prepare official tide document extraction
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Alerta Rio current source and original timestamp
        if: always()
        run: node backend/scripts/probe-official-sources.mjs
      - name: Marinha CHM warnings and RJ tide products
        if: always()
        run: node backend/scripts/probe-chm.mjs
      - name: INMET original observation freshness
        if: always()
        run: |
          node scripts/rj-inmet-live-probe.mjs
          node --input-type=module -e "import {readFileSync} from 'node:fs'; const r=JSON.parse(readFileSync('evidence/rj-interface-review/inmet-live-source.json','utf8')); if(r.state!=='AVAILABLE')process.exit(1);"
      - name: Preserve live source results including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: blaise-rj-current-source-connections
          path: |
            evidence/official-sources/
            evidence/rj-interface-review/inmet-live-source.json
          if-no-files-found: error
          retention-days: 5
