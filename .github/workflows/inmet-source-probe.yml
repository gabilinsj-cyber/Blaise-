name: INMET Source Probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inmet-source-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: '24.20.0'
      - name: Probe official INMET CAP warnings fail-closed
        shell: bash
        run: |
          set -euo pipefail
          node backend/scripts/probe-inmet.mjs
      - name: Upload sanitized INMET source evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: blaise-inmet-source-evidence
          if-no-files-found: error
          path: evidence/official-sources/inmet.json
