name: Blaise RJ meteoblue Free API security / no-credit offline tests
on:
  pull_request:
    paths:
      - backend/src/rj-meteoblue-free-connection.mjs
      - backend/src/rj-meteoblue-free-key-check.mjs
      - backend/src/rj-meteoblue-basic6h-parse.mjs
      - backend/src/rj-meteoblue-free-firestore-store.mjs
      - backend/src/rj-meteoblue-free-collector.mjs
      - backend/src/rj-meteoblue-runtime-optional.mjs
      - backend/src/runtime.mjs
      - backend/scripts/meteoblue-free-private-field-audit.mjs
      - backend/scripts/meteoblue-free-credit-status.mjs
      - backend/test/rj-meteoblue-free-collector.test.mjs
      - backend/test/rj-meteoblue-free-key-check.test.mjs
      - backend/scripts/check-meteoblue-free-one-shot.mjs
      - docs/RJ_METEOBLUE_FREE_SECURE_ACTIVATION_20261118.md
      - .github/workflows/rj-meteoblue-free-offline-ci.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  meteoblue-security-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
      - name: Assert no provider credentials or HTTP calls are required
        run: |
          set -euo pipefail
          node --check backend/src/rj-meteoblue-free-connection.mjs
          node --check backend/src/rj-meteoblue-free-key-check.mjs
          node --check backend/src/rj-meteoblue-basic6h-parse.mjs
          node --check backend/src/rj-meteoblue-free-firestore-store.mjs
          node --check backend/src/rj-meteoblue-free-collector.mjs
          node --check backend/src/rj-meteoblue-runtime-optional.mjs
          node --check backend/src/runtime.mjs
          node --check backend/scripts/meteoblue-free-private-field-audit.mjs
          node backend/scripts/meteoblue-free-private-field-audit.mjs
          node --check backend/scripts/meteoblue-free-credit-status.mjs
          node backend/scripts/meteoblue-free-credit-status.mjs
          node --test backend/test/rj-meteoblue-free-key-check.test.mjs backend/test/rj-meteoblue-free-collector.test.mjs
          node backend/scripts/check-meteoblue-free-one-shot.mjs
