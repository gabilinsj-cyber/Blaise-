name: RJ International Staging Live Sources
on:
  pull_request:
    paths:
      - .github/workflows/rj-staging-live-sources.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rj-international-staging-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public-catalogs:
    name: Catalog availability (no weather values)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
      - name: Explicit read-only external catalog check
        run: |
          node backend/scripts/probe-international-live-staging.mjs --live
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: blaise-rj-live-catalog-evidence
          path: evidence/international-sources/catalog-probe.json
          if-no-files-found: warn

  real-noaa-wave:
    name: Offshore NOAA real GRIB scientific probe (not client)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
      - name: Install trusted GRIB decoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libeccodes-tools
          grib_get -V
      - name: Validate one fixed offshore RJ NOAA forecast product
        run: |
          node backend/scripts/probe-noaa-wave-staging.mjs --live
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: blaise-rj-noaa-offshore-real-evidence
          path: evidence/international-sources/noaa-wave-offshore.json
          if-no-files-found: warn
