name: Android CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install backend dependencies
        working-directory: backend
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Backend syntax and unit tests
        working-directory: backend
        run: |
          set -euo pipefail
          npm run check
          npm test
      - name: Backend concurrency and backpressure smoke
        working-directory: backend
        run: |
          set -euo pipefail
          mkdir -p evidence
          npm run load-smoke | tee evidence/load-smoke.txt
          grep -F 'LOAD_SMOKE=PASS' evidence/load-smoke.txt
          grep -F 'BACKPRESSURE_SMOKE=PASS' evidence/load-smoke.txt
          grep -F 'SCALE_3M_9M=NOT_RUN_EXTERNAL_ENVIRONMENT_REQUIRED' evidence/load-smoke.txt
      - name: Build production backend container
        run: |
          set -euo pipefail
          docker build --tag blaise-entitlement-backend:ci backend
          mkdir -p backend/evidence
          docker image inspect blaise-entitlement-backend:ci --format '{{.Config.User}}' > backend/evidence/container-user.txt
          test "$(cat backend/evidence/container-user.txt)" = "node"
          (cd backend && npm ls --all) > backend/evidence/npm-tree.txt
      - name: Runtime smoke production backend container
        run: |
          set -euo pipefail
          mkdir -p backend/evidence
          name="blaise-backend-ci-${GITHUB_RUN_ID}"
          cleanup() { docker rm -f "$name" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          docker run -d --name "$name" \
            -p 127.0.0.1::8080 \
            -e BLAISE_MONTHLY_PRODUCT_ID=ci.monthly \
            -e BLAISE_ANNUAL_PRODUCT_ID=ci.annual \
            -e BLAISE_VERIFY_MAX_CONCURRENT=128 \
            -e BLAISE_RTDN_MAX_CONCURRENT=64 \
            blaise-entitlement-backend:ci >/dev/null

          mapping="$(docker port "$name" 8080/tcp)"
          port="${mapping##*:}"
          [[ "$port" =~ ^[0-9]+$ ]]
          base="http://127.0.0.1:${port}"

          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS "$base/healthz" > backend/evidence/backend-health.json; then
              ready=1
              break
            fi
            sleep 1
          done
          if (( ready == 0 )); then
            docker logs "$name" > backend/evidence/backend-runtime.log 2>&1 || true
            exit 1
          fi

          grep -F '"status":"ok"' backend/evidence/backend-health.json
          docker inspect "$name" --format '{{.Config.User}}' > backend/evidence/backend-runtime-user.txt
          grep -Fx 'node' backend/evidence/backend-runtime-user.txt

          curl -sS -o /dev/null -w '%{http_code}' \
            -X POST --data '{}' "$base/v1/entitlements/verify" \
            > backend/evidence/backend-content-type-status.txt
          grep -Fx '415' backend/evidence/backend-content-type-status.txt

          curl -sS -o /dev/null -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' --data '{' \
            "$base/v1/entitlements/verify" \
            > backend/evidence/backend-invalid-json-status.txt
          grep -Fx '400' backend/evidence/backend-invalid-json-status.txt

          docker logs "$name" > backend/evidence/backend-runtime.log 2>&1
          printf '%s\n' \
            'BACKEND_GATE=PASS' \
            'syntax=PASS' \
            'unit_tests=PASS' \
            'container_build=PASS' \
            'container_non_root_user=PASS' \
            'container_runtime_health=PASS' \
            'content_type_fail_closed=PASS' \
            'invalid_json_fail_closed=PASS' \
            'rtdn_instance_replay_guard=PASS_UNIT' \
            'transient_upstream_retry=PASS_UNIT' \
            'bounded_concurrency=PASS_SMOKE' \
            'overload_fail_closed=PASS_SMOKE' \
            'scale_3m_9m=BLOCKED_EXTERNAL_LOAD_ENVIRONMENT' \
            'multi_region_failover=BLOCKED_EXTERNAL_INFRA' \
            'google_play_live_credentials=BLOCKED_EXTERNAL' \
            'firebase_live_credentials=BLOCKED_EXTERNAL' \
            > backend/evidence/backend-gate.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: blaise-backend-evidence
          path: backend/evidence/

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Prepare Android SDK CLI
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/build-tools/35.0.0" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version
      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Install Android 35 toolchain
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
          test -x "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          test -x "$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign"
      - name: Install bundletool
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/bundletool.jar" https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $RUNNER_TEMP/bundletool.jar" | sha256sum -c -
          echo "BUNDLETOOL_JAR=$RUNNER_TEMP/bundletool.jar" >> "$GITHUB_ENV"
      - name: Verify, test, build and SBOM
        run: ./scripts/ci.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: blaise-v6-evidence
          path: |
            app/build/outputs/**/*.apk
            app/build/outputs/**/*.aab
            evidence/
