name: Blaise RJ lite on-device test APK
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/prepare-dora-voice.py'
      - '.github/workflows/rj-lite-android-test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blaise-rj-lite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lite-android-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Configure Android 35 SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build lightweight debug (system pt-BR TTS, no offline Dora model)
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace -PblaiseLiteVoice=true \
            :app:testDebugUnitTest :app:assembleDebug
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          if unzip -Z1 "$apk" | grep -Eq '^assets/dora/(model\.onnx|voices\.bin)$'; then
            echo 'ERROR: offline voice model accidentally packaged in lite build'
            exit 1
          fi
          mkdir -p evidence/rj-lite
          cp "$apk" evidence/rj-lite/blaise-v6-rj-lite-debug.apk
          bytes=$(stat -c%s "$apk")
          echo "LITE_APK_BYTES=$bytes" | tee evidence/rj-lite/build-report.txt
          echo 'LITE_VOICE=ANDROID_SYSTEM_TTS_NOT_DORA' | tee -a evidence/rj-lite/build-report.txt
          echo 'LITE_INSTALL_STATUS=NOT_A_PHYSICAL_PHONE_TEST' | tee -a evidence/rj-lite/build-report.txt
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify "$apk"
      - name: Smoke-test installation, launch and screenshot in Android 35 emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          disk-size: 6G
          disable-animations: true
          emulator-options: '-no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -no-snapshot -camera-back none'
          script: |
            set -euo pipefail
            adb install -r evidence/rj-lite/blaise-v6-rj-lite-debug.apk
            adb shell am start -n br.com.blaise.rj.debug/br.com.blaise.rj.MainActivity
            sleep 15
            adb shell dumpsys activity activities | grep -F 'br.com.blaise.rj.debug'
            adb shell screencap -p /sdcard/blaise-lite-test.png
            adb pull /sdcard/blaise-lite-test.png evidence/rj-lite/portrait.png
            test -s evidence/rj-lite/portrait.png
            echo 'EMULATOR_INSTALL_LAUNCH=PASS' | tee -a evidence/rj-lite/build-report.txt
      - name: Upload single installable test APK and emulator evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blaise-v6-rj-lite-debug-test-apk
          path: evidence/rj-lite/
          retention-days: 5
          if-no-files-found: warn
