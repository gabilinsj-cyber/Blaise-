name: Guardian Clean - Cloud Test

on:
  push:
    branches:
      - test/guardian-cloud-20261127

permissions:
  contents: read

jobs:
  guardian-cloud:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.20.0'

      - name: Validar dependencias oficiais
        working-directory: backend
        run: |
          test "$(node --version)" = "v24.20.0"
          sha256sum -c package-lock.sha256
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Testar SDK Guardian Cloud
        working-directory: backend
        run: |
          node --test test/guardian-cloud-sdk.test.mjs

      - name: Guardian Firestore Emulator
        working-directory: backend
        env:
          FIRESTORE_EMULATOR_HOST: '127.0.0.1:8787'
        run: |
          set -euo pipefail

          NAME="guardian-firestore-${GITHUB_RUN_ID}"

          cleanup() {
            docker logs "$NAME" || true
            docker rm -f "$NAME" || true
          }

          trap cleanup EXIT

          docker run -d --name "$NAME" \
            -p 127.0.0.1:8787:8787 \
            -e COMPONENTS=google-cloud-cli-firestore-emulator \
            gcr.io/google.com/cloudsdktool/google-cloud-cli:stable \
            gcloud emulators firestore start \
            --host-port=0.0.0.0:8787 \
            --project=demo-guardian-clean --quiet

          READY=0

          for i in $(seq 1 120); do
            if (echo > /dev/tcp/127.0.0.1/8787) 2>/dev/null; then
              READY=1
              break
            fi
            sleep 3
          done

          test "$READY" -eq 1

          node scripts/guardian-cloud-emulator-test.mjs
