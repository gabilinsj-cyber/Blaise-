name: Blaise RJ meteorological source release audit (read-only)
on:
  pull_request:
    paths:
      - backend/src/rj-source-sector-matrix.mjs
      - backend/src/rj-meteoblue-free-publication-contract.mjs
      - backend/src/rj-meteorological-production-readiness.mjs
      - backend/src/rj-production-control-plane-audit.mjs
      - backend/scripts/rj-meteorological-production-readiness.mjs
      - backend/scripts/rj-production-cloud-readonly-probe.mjs
      - backend/test/rj-meteorological-production-readiness.test.mjs
      - backend/test/rj-production-control-plane-audit.test.mjs
      - .github/workflows/rj-meteorological-production-readiness.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-readiness-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
      - name: Audit evidence and prove release is fail-closed
        run: |
          set -euo pipefail
          node --check backend/src/rj-meteorological-production-readiness.mjs
          node --check backend/src/rj-production-control-plane-audit.mjs
          node --check backend/scripts/rj-production-cloud-readonly-probe.mjs
          node --check backend/scripts/rj-meteorological-production-readiness.mjs
          node --test backend/test/rj-meteorological-production-readiness.test.mjs backend/test/rj-production-control-plane-audit.test.mjs
          node backend/scripts/rj-production-cloud-readonly-probe.mjs
          node backend/scripts/rj-meteorological-production-readiness.mjs --assert-private
          echo 'RJ_METEOROLOGICAL_NEW_SOURCE_RELEASE=BLOCKED_PENDING_EVIDENCE'
