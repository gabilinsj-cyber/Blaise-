name: Blaise Open Tennis v3.9.0 Android Build

on:
  push:
    branches:
      - tennis-v390-build-main-4
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          SDKMANAGER="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}" -type f -name sdkmanager -perm -111 2>/dev/null | head -n1 || true)"
          fi
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Verify v3.9.0 Android source
        shell: bash
        run: |
          set -euo pipefail
          test -f tennis-v390-android/app/build.gradle.kts
          test -f tennis-v390-android/app/src/main/AndroidManifest.xml
          grep -q '^android.useAndroidX=true$' tennis-v390-android/gradle.properties

      - name: Build APK and AAB
        shell: bash
        working-directory: tennis-v390-android
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace clean :app:assembleRelease :app:bundleRelease

      - name: Verify artifacts and hashes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tennis-v390-ci/evidence
          APK="$(find tennis-v390-android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -size +0c | head -n1)"
          AAB="$(find tennis-v390-android/app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -size +0c | head -n1)"
          test -n "$APK"
          test -n "$AAB"
          printf 'APK=%s\nAAB=%s\n' "$APK" "$AAB" | tee tennis-v390-ci/evidence/ARTIFACT_PATHS.txt
          sha256sum "$APK" "$AAB" | tee tennis-v390-ci/evidence/SHA256SUMS.txt
          ls -lh "$APK" "$AAB"

      - name: Upload APK and AAB evidence
        uses: actions/upload-artifact@v4
        with:
          name: blaise-open-tennis-v3.9.0-android-artifacts
          path: |
            tennis-v390-android/app/build/outputs/apk/release/*.apk
            tennis-v390-android/app/build/outputs/bundle/release/*.aab
            tennis-v390-ci/evidence/SHA256SUMS.txt
            tennis-v390-ci/evidence/ARTIFACT_PATHS.txt
          if-no-files-found: error
          retention-days: 7
