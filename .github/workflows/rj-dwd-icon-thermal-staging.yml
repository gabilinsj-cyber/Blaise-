name: RJ DWD ICON German thermal staging
# Public non-billable DWD model only; one GRIB download, 92 points, no app publish.
on:
  pull_request:
    paths:
      - backend/scripts/probe-dwd-icon-numeric-staging.mjs
      - backend/test/rj-dwd-icon-thermal-staging.test.mjs
      - backend/src/rj-dwd-icon-regrid.mjs
      - backend/test/rj-dwd-icon-regrid.test.mjs
      - backend/src/rj-dwd-thermal-admin-bridge.mjs
      - backend/test/rj-dwd-thermal-admin-bridge.test.mjs
      - backend/scripts/audit-dwd-icon-thermal-staging.mjs
      - backend/src/rj-dwd-icon-92-admin-bridge.mjs
      - backend/test/rj-dwd-icon-92-real.test.mjs
      - backend/scripts/audit-dwd-icon-92-staging.mjs
      - .github/workflows/rj-dwd-icon-thermal-staging.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dwd-rj-real-temperature:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
      - name: Test official IBGE coordinates and ICON metadata rules
        run: |
          node --check backend/scripts/probe-dwd-icon-numeric-staging.mjs
          node --test backend/test/rj-dwd-icon-thermal-staging.test.mjs
          node --check backend/src/rj-dwd-icon-regrid.mjs
          node --test backend/test/rj-dwd-icon-regrid.test.mjs
          node --test backend/test/rj-dwd-thermal-admin-bridge.test.mjs
          node --check backend/scripts/probe-dwd-icon-numeric-staging.mjs
          node --test backend/test/rj-dwd-icon-92-real.test.mjs
      - name: Install GRIB2 and BZIP2 decoders
        run: |
          set -euo pipefail
          # apt update has timed out on GitHub runners. Try the packaged
          # index first; fall back to a bounded, IPv4-only refresh if needed.
          if ! command -v grib_get >/dev/null || ! command -v cdo >/dev/null; then
            if ! sudo env DEBIAN_FRONTEND=noninteractive timeout 200 apt-get install -y -qq --no-install-recommends libeccodes-tools bzip2 cdo; then
              timeout 150 sudo apt-get update -qq -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::ForceIPv4=true
              sudo env DEBIAN_FRONTEND=noninteractive timeout 240 apt-get install -y -qq --no-install-recommends libeccodes-tools bzip2 cdo
            fi
          fi
          command -v cdo
          command -v grib_get
          grib_get -V
      - name: Decode 92 IBGE municipality points from ONE official DWD ICON forecast grid
        run: node backend/scripts/probe-dwd-icon-numeric-staging.mjs --live --statewide
      - name: Verify source provenance in private Blaise thermal audit
        run: node backend/scripts/audit-dwd-icon-thermal-staging.mjs
      - name: Audit all 92 official model points inside the private Blaise weather matrix
        run: node backend/scripts/audit-dwd-icon-92-staging.mjs
      - name: Upload evidence even if provider unavailable
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blaise-rj-dwd-icon-real-thermal-evidence
          path: |
            evidence/international-sources/dwd-icon-rio.json
            evidence/international-sources/dwd-icon-rio-admin-audit.json
            evidence/international-sources/dwd-icon-rj-92.json
            evidence/international-sources/dwd-icon-rj-92-admin-audit.json
          if-no-files-found: warn
