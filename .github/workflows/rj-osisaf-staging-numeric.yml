name: RJ OSI SAF SST Numeric Validation
# External numeric product is probed only by an authorized manual workflow.
# The first staging run on 17/11/2026 found no discoverable recent NetCDF.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ossaf-sst:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install trusted netCDF4 reader from system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends python3-netcdf4 python3-numpy
          /usr/bin/python3 -c 'import netCDF4,numpy; print("netCDF decoder ready")'
      - name: Check one actual EUMETSAT OSI-207-c surface temperature cell, fail closed
        run: |
          /usr/bin/python3 backend/scripts/probe-osisaf-sst-staging.py --live
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: blaise-rj-osi-saf-numeric-evidence
          path: evidence/international-sources/osi-saf-sst-staging.json
          if-no-files-found: warn
