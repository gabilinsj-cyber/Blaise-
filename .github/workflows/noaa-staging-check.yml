name: NOAA RJ - Homologacao offline

on:
  push:
    branches:
      - test/rj-noaa-android-20261028
    paths:
      - .github/workflows/noaa-staging-check.yml

permissions:
  contents: read

jobs:
  validar-noaa:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: staging-noaa-rj

    steps:
      - name: Obter codigo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Configurar Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.20.0'

      - name: Validar NOAA sem deploy
        run: |
          set -euo pipefail
          node --check backend/src/noaa-wave-collector.mjs
          node --check backend/src/noaa-wave-cache.mjs
          node --test backend/test/noaa-wave-cache.test.mjs
          echo "NOAA_STAGING_OFFLINE=PASS"
