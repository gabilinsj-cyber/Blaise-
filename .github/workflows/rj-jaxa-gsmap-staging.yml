name: RJ JAXA GSMaP v9 Staging Access
# External FTP reachability attempts occur only through a human dispatch.
# Initial unauthenticated probe was archived on 17/11/2026.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rj-jaxa-staging-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public-protocol-check:
    name: JAXA FTPS protocol check (no passwords)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6
        with:
          python-version: '3.12'
      - name: Run offline auth and provenance tests
        run: python -m unittest discover -s backend/test -p test_jaxa_gsmap_staging.py -v
      - name: Only query the public host TLS capability, never transmit credentials
        run: python backend/scripts/probe-jaxa-gsmap-staging.py --live
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: blaise-jaxa-public-ftps-capability
          path: evidence/international-sources/jaxa-gsmap-v9-ftps-probe.json
          if-no-files-found: warn

  credentialed-directory-check:
    name: JAXA authenticated listing (manual dispatch only)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      JAXA_GSMAP_FTP_USERNAME: ${{ secrets.JAXA_GSMAP_FTP_USERNAME }}
      JAXA_GSMAP_FTP_PASSWORD: ${{ secrets.JAXA_GSMAP_FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6
        with:
          python-version: '3.12'
      - name: Check TLS and list only v9 directory with bounded results
        run: python backend/scripts/probe-jaxa-gsmap-staging.py --live
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: blaise-jaxa-v9-staging-listing
          path: evidence/international-sources/jaxa-gsmap-v9-ftps-probe.json
          if-no-files-found: warn
