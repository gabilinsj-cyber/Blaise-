name: RJ WeatherAPI Free 92-city offline budget gate
on:
  pull_request:
    paths:
      - 'backend/src/rj-weatherapi-free-92-plan.mjs'
      - 'backend/test/rj-weatherapi-free-92-plan.test.mjs'
      - 'docs/RJ_WEATHERAPI_FREE_CANDIDATE_20261119.md'
      - 'app/src/main/java/br/com/blaise/rj/WeatherSourceResponsibility.kt'
      - 'app/src/test/java/br/com/blaise/rj/WeatherSourceResponsibilityTest.kt'
      - '.github/workflows/rj-weatherapi-free-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rj-weatherapi-free-offline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-budget:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
      - name: Never contact WeatherAPI or fetch keys
        run: |
          set -euo pipefail
          node --check backend/src/rj-weatherapi-free-92-plan.mjs
          node --test backend/test/rj-weatherapi-free-92-plan.test.mjs
