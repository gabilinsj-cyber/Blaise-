name: Android Store Packages

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  signed-store-packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Install Android toolchain
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install pinned bundletool
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/bundletool.jar" https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $RUNNER_TEMP/bundletool.jar" | sha256sum -c -
          echo "BUNDLETOOL_JAR=$RUNNER_TEMP/bundletool.jar" >> "$GITHUB_ENV"
      - name: Prepare signing material
        env:
          BLAISE_KEYSTORE_B64: ${{ secrets.BLAISE_KEYSTORE_B64 }}
          BLAISE_STORE_PASSWORD: ${{ secrets.BLAISE_STORE_PASSWORD }}
          BLAISE_KEY_ALIAS: ${{ secrets.BLAISE_KEY_ALIAS }}
          BLAISE_KEY_PASSWORD: ${{ secrets.BLAISE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${BLAISE_KEYSTORE_B64:-}"
          test -n "${BLAISE_STORE_PASSWORD:-}"
          test -n "${BLAISE_KEY_ALIAS:-}"
          test -n "${BLAISE_KEY_PASSWORD:-}"
          printf '%s' "$BLAISE_KEYSTORE_B64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/blaise-release.jks"
          chmod 600 "$RUNNER_TEMP/blaise-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/blaise-release.jks" -storepass "$BLAISE_STORE_PASSWORD" -alias "$BLAISE_KEY_ALIAS" >/dev/null
          echo "BLAISE_KEYSTORE_PATH=$RUNNER_TEMP/blaise-release.jks" >> "$GITHUB_ENV"
      - name: Build and validate all store packages
        env:
          BLAISE_STORE_PASSWORD: ${{ secrets.BLAISE_STORE_PASSWORD }}
          BLAISE_KEY_ALIAS: ${{ secrets.BLAISE_KEY_ALIAS }}
          BLAISE_KEY_PASSWORD: ${{ secrets.BLAISE_KEY_PASSWORD }}
          BLAISE_MONTHLY_PRODUCT_ID: ${{ vars.BLAISE_MONTHLY_PRODUCT_ID }}
          BLAISE_ANNUAL_PRODUCT_ID: ${{ vars.BLAISE_ANNUAL_PRODUCT_ID }}
          BLAISE_ENTITLEMENT_VERIFY_URL: ${{ vars.BLAISE_ENTITLEMENT_VERIFY_URL }}
          BLAISE_FIREBASE_APPLICATION_ID: ${{ vars.BLAISE_FIREBASE_APPLICATION_ID }}
          BLAISE_FIREBASE_API_KEY: ${{ vars.BLAISE_FIREBASE_API_KEY }}
          BLAISE_FIREBASE_PROJECT_ID: ${{ vars.BLAISE_FIREBASE_PROJECT_ID }}
          BLAISE_FIREBASE_SENDER_ID: ${{ vars.BLAISE_FIREBASE_SENDER_ID }}
        run: bash scripts/build-all-store-packages.sh
      - name: Upload signed packages and evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: blaise-v6-all-stores-${{ github.run_id }}
          if-no-files-found: error
          path: |
            store-packages/**/*
            evidence/stores/**/*
